<title>Rumo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: coluna única de celular; cartão "Agora" no topo, linha do tempo do dia embaixo; navegação fixa no rodapé e botão "Travei" flutuante */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#132826; --muted:#5A6F6C; --line:#D3DFDC;
  --sea:#0E6B66; --on-sea:#FFFFFF; --sea-soft:#D5EBE8;
  --sun:#E3A02A; --sun-soft:#FBEBC8; --sun-ink:#76500C;
  --coral:#C9503A; --on-coral:#FFFFFF;
  --scrim:rgba(10,30,28,.45); --shadow:rgba(10,30,28,.22);
  --display:"Bricolage Grotesque", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1615; --surface:#142220; --ink:#E2EDEB; --muted:#91A6A3; --line:#233B38;
  --sea:#4CC2B7; --on-sea:#06201E; --sea-soft:#173A36;
  --sun:#F2BE5C; --sun-soft:#3A2D12; --sun-ink:#F2C670;
  --coral:#F07A63; --on-coral:#2A0D07;
  --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1615; --surface:#142220; --ink:#E2EDEB; --muted:#91A6A3; --line:#233B38;
  --sea:#4CC2B7; --on-sea:#06201E; --sea-soft:#173A36;
  --sun:#F2BE5C; --sun-soft:#3A2D12; --sun-ink:#F2C670;
  --coral:#F07A63; --on-coral:#2A0D07;
  --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(160px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:4px 10px}
.brand{font:800 23px/1 var(--display);letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.brand svg{flex:none}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}

.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-block:6px 10px}
.dayhead h1{font:800 clamp(30px,8vw,38px)/1 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.dayhead .date{color:var(--muted);font-size:15px;margin-top:6px}
.arrows{display:flex;gap:6px;flex:none}

.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:14px;font-weight:700}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.isr{background:var(--sun-soft);color:var(--sun-ink)} .chip.isr i{background:var(--sun)}
.chip.solo{background:var(--sea-soft);color:var(--ink)} .chip.solo i{background:var(--sea)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;min-height:44px}
.btn.primary{background:var(--sea);color:var(--on-sea)}
.btn.ghost{background:transparent;border:1.5px solid currentColor}
.btn.soft{background:var(--sea-soft);color:var(--ink)}
.btn.coral{background:var(--coral);color:var(--on-coral)}
.btn.block{width:100%}
.link{background:none;border:0;padding:6px 0;font-weight:700;color:var(--sea);font-size:14px;min-height:34px}
.link.muted{color:var(--muted)}

.now{background:var(--sea);color:var(--on-sea);border-radius:22px;padding:18px;display:grid;gap:10px;margin-block:12px 6px}
.now .eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
.now h2{font:800 27px/1.08 var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.now .what{font-size:16px;opacity:.95}
.now .btn.primary{background:var(--on-sea);color:var(--sea)}

.dateline{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:15px;margin-block:2px 22px}
.icon-btn.sm{width:36px;height:36px;border-radius:10px;font-size:18px}
.icon-btn.wide{width:auto;padding-inline:10px;font-size:13px;font-weight:700}
.focus{display:grid;gap:12px;padding-block:6px 26px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.focus h1{font:800 clamp(36px,10.5vw,52px)/1.02 var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}
.focus .ctx{font-size:17px;color:var(--muted);margin:0}
.clock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.clock .n{font:800 30px/1 var(--display);color:var(--sea);font-variant-numeric:tabular-nums}
.clock.warn .n{color:var(--coral)}
.clock .until{font-size:16px}
.q{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;color:var(--muted);padding:0}
.why{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;margin:0}
.next{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:16px}
.nx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline}
.nx .h{font-weight:700;font-size:17px} .nx .d{font-size:14px;color:var(--muted)}
.nx .u{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fixedline{font-size:14px;color:var(--muted);margin:22px 0 4px}
.plan-h{font:800 30px/1.05 var(--display);letter-spacing:-.02em;margin:0 0 14px}
.tm small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ask{background:var(--sun-soft);color:var(--ink);border-radius:18px;padding:14px 16px;display:grid;gap:10px;margin-block:6px 10px}
.ask p{margin:0}

.section-title{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding-inline:14px}
.blk{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;padding-block:14px;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;line-height:1.25}
.ttl{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{color:var(--muted);font-size:14px}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag.isr{background:var(--sun-soft);color:var(--sun-ink)}
.tag.fixo{background:var(--line);color:var(--ink)}
.tag.cur{background:var(--sea);color:var(--on-sea)}
.tag.late{background:var(--coral);color:var(--on-coral)}
.blk.cur .tm{color:var(--sea)}
.blk.past:not(.cur) .tm,.blk.past:not(.cur) .ttl{color:var(--muted)}
.blk.done{opacity:.55}
.blk.done .ttl .t{text-decoration:line-through}
.sug{margin-top:3px}
.alts{font-size:14px;color:var(--muted)}
.mini{display:flex;gap:16px;margin-top:4px;flex-wrap:wrap}
.mer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:6px 0 0;font-size:15px}
.mer dt{color:var(--muted)} .mer dd{margin:0;font-weight:700}
.mer dd.miss{color:var(--coral)}

.wk{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;padding-block:14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.wk:first-child{border-top:0}
.wk .d{font:800 22px/1 var(--display)} .wk .d small{display:block;font:400 13px var(--body);color:var(--muted);margin-top:4px;text-transform:capitalize}
.wk ul{margin:6px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted);display:grid;gap:2px}

.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;min-height:46px}
textarea.field{min-height:150px;resize:vertical}
.form{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) auto}
.form.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.form.three .field:first-child{grid-column:1/-1}
label.lbl{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding-inline:14px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.nochk{grid-template-columns:minmax(0,1fr) auto}
.li .sub{font-size:14px;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--sea);background:transparent;display:grid;place-items:center;padding:0;color:var(--on-sea)}
.check.on{background:var(--sea)}
.x{border:0;background:none;color:var(--muted);font-size:22px;width:36px;height:36px;border-radius:10px}
.li.done .t{text-decoration:line-through;color:var(--muted)}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;gap:8px}
.pill.out{background:transparent;color:var(--coral);border-color:var(--coral);text-decoration:line-through}
.pill.buy{background:var(--coral);color:var(--on-coral);border-color:var(--coral)}
.pill .rm{font-weight:700;opacity:.7}
.empty{color:var(--muted);font-size:15px;margin:0}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{background:none;border:0;display:grid;justify-items:center;gap:3px;padding:9px 0 8px;font-size:12px;color:var(--muted);min-height:58px}
.nav button[aria-current="page"]{color:var(--sea);font-weight:700}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--coral);color:var(--on-coral);border:0;border-radius:999px;padding:14px 20px;font-weight:800;font-size:16px;box-shadow:0 8px 22px var(--shadow)}

.sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding-top:20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.panel h2{font:800 26px/1.1 var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.panel p{margin:0}
.panel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.steps{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;min-height:48px}
.big{font:800 clamp(64px,22vw,96px)/1 var(--display);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);width:0}
.center{text-align:center}
.soon{border:1px dashed var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:15px}
</style>

/* ---------- Sugestões ---------- */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rotate(a,n){if(!a.length)return a;n=((n%a.length)+a.length)%a.length;return a.slice(n).concat(a.slice(0,n))}
const toFront=(l,test)=>{const i=l.findIndex(test);if(i>0)l.unshift(l.splice(i,1)[0]);return l};

function poolList(name,d,isr){
  const wd=d.getDay(), seed=hash(key(d)+name);
  const home=arr=>arr.filter(x=>x[1].every(has)).map(x=>({n:x[0],sub:'Em casa'}));
  const recipes=meal=>RECIPES.filter(r=>r.meals.includes(meal)&&r.needs.every(has)).map(r=>({n:r.n,sub:'Em casa'}));
  const eatOut=meal=>places.filter(p=>p.type==='comida'&&(p.meals||['almoco','jantar']).includes(meal)&&(!p.days||p.days.includes(wd))&&(!p.israel||isr)).map(p=>({n:p.n,sub:p.note||'Comer fora'}));
  const passeios=manha=>places.filter(p=>p.type==='passeio'&&(!p.days||p.days.includes(wd))&&(!p.manha||manha)).map(p=>({n:p.n,sub:p.note||''}));
  switch(name){
    case 'cafe':return home(CAFE);
    case 'cafeDomingo':return eatOut('cafe').concat(home(CAFE));
    case 'leve':return home(LEVE);
    case 'lanche':return home(LANCHES);
    case 'manha':return toFront(shuffle(passeios(true),seed),o=>/^Feira/.test(o.n));
    case 'tarde':return shuffle(passeios(false),seed);
    case 'almocoIsr':return shuffle(eatOut('almoco'),seed).concat(shuffle(recipes('almoco'),seed+1));
    case 'almocoEscola':return toFront(eatOut('almoco'),o=>o.n==='PF perto da escola');
    case 'almocoSolo':return shuffle(eatOut('almoco').concat(recipes('almoco')),seed);
    case 'jantar':return shuffle(recipes('jantar').concat(eatOut('jantar')),seed);
  }
  return [];
}
function pickFrom(pool,seed,sh){const ok=pool.filter(x=>x[1].every(has));if(!ok.length)return null;const r=rotate(shuffle(ok,seed),sh);return r[0][0]}
function merenda(sk,d){
  const dk=key(d), sh=shiftOf(dk,sk), seed=hash(dk+'merenda');
  const suco=has('Suco de uva')?'Suco de uva':null;
  return{suco:suco||pickFrom([['Yakult',['Yakult']],['Danoninho',['Danoninho']]],seed,sh),sucoFalta:!suco,doce:pickFrom(MER_DOCE,seed+1,sh),sal:pickFrom(MER_SAL,seed+2,sh)};
}
function openTasks(){return tasks.filter(t=>!t.done).slice().sort((a,b)=>(a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:0)}
function dueText(due){
  if(!due)return'Sem prazo';
  const t=key(today());
  return due<t?'Atrasada':due===t?'Prazo hoje':'Prazo '+ddmm(parse(due));
}
function dueTag(due){
  if(!due)return'';
  const t=key(today());
  if(due<t)return'<span class="tag late">atrasada</span>';
  if(due===t)return'<span class="tag isr">prazo hoje</span>';
  return`<span class="tag fixo">prazo ${ddmm(parse(due))}</span>`;
}

function resolve(st,d,nm,live,ti){
  const dk=key(d), dm=doneMap[dk]||{};
  const doneLate=!!dm[st.id+'-late'];
  const late=!!st.late&&(doneLate||(live&&!dm[st.id]&&nm>=mins(st.late.at)));
  const s=late?Object.assign({},st,st.late):Object.assign({},st);
  s.late=late; s.sk=st.id+(late?'-late':''); s.done=!!(dm[st.id]||doneLate);
  s.head=s.head||''; s.detail=s.detail||''; s.swap=false;
  if(s.pool){
    const o=rotate(poolList(s.pool,d,!!s.isr),shiftOf(dk,s.sk));
    s.swap=o.length>1;
    if(o.length){s.head=o[0].n;s.detail=[o[0].sub,o[1]?'ou '+o[1].n:''].filter(Boolean).join(' · ')}
    else{s.head=s.head||s.ctx;s.detail='Nada em casa pra isso. Veja a lista de compras.'}
  }
  if(s.merenda){const m=merenda(s.sk,d);s.detail=[m.suco,m.doce,m.sal].filter(Boolean).join(' + ')+(m.sucoFalta?' (suco de uva acabou)':'');s.swap=true}
  if(s.tarefa){
    const ts=openTasks();
    if(ts.length){const t=ts[(((ti||0)+shiftOf(dk,s.sk))%ts.length+ts.length)%ts.length];s.head=t.t;s.detail=dueText(t.due);s.taskId=t.id;s.swap=ts.length>1}
    else{s.head='Tempo livre';s.detail='Cadastre tarefas na aba Tarefas que eu encaixo aqui.'}
  }
  if(s.pend){const out=pantry.filter(p=>!p.have);s.detail=out.length?'Comprar: '+out.slice(0,4).map(p=>p.n).join(', ')+(out.length>4?' e mais '+(out.length-4):''):'Lista de compras vazia. Só os recados.'}
  return s;
}

function dayState(d){
  const dk=key(d), live=dk===key(today()), nm=live?nowMin():-1;
  let ti=0;
  let list=routine(d).map(st=>{const r=resolve(st,d,nm,live,ti);if(r.tarefa&&!r.done)ti++;return r});
  (later[dk]||[]).forEach(id=>{
    const i=list.findIndex(s=>s.id===id);if(i<0)return;
    const [s]=list.splice(i,1);
    let j=list.findIndex((x,k)=>k>=i&&(x.fixed||x.id==='revisao'));
    if(j<0)j=list.length;
    list.splice(j,0,s);
  });
  const lateLunch=list.some(s=>s.id==='almoco'&&s.late);
  list.forEach((s,i)=>{
    s.prev=i?list[i-1].until:null;
    s.skipped=live&&!s.done&&(
      (!s.fixed&&nm>=mins(s.until)+(s.skipAfter?0:30))||
      (s.skipIfLateLunch&&lateLunch)||
      (s.fixed&&nm>=(s.end?mins(s.end):mins(s.until)+20)));
  });
  return{dk,live,nm,list};
}

function fmtDur(m){m=Math.max(0,Math.round(m));if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+'h'+(r?String(r).padStart(2,'0'):'')}
function clock(s,nm){
  const u=mins(s.until);
  if(s.fixed){
    if(nm<u)return{n:fmtDur(u-nm),l:`pra ${s.until} · horário fixo`,warn:u-nm<=15};
    if(s.end&&nm<mins(s.end))return{n:'Agora',l:`até ${s.end}`};
    return{n:'passou '+fmtDur(nm-u),l:`era ${s.until}`,warn:true};
  }
  if(s.from&&nm<mins(s.from))return{n:fmtDur(mins(s.from)-nm),l:`pra começar · às ${s.from}`};
  if(nm<u)return{n:fmtDur(u-nm),l:`até ${s.until}`,warn:u-nm<10};
  return{n:'passou '+fmtDur(nm-u),l:`era até ${s.until}`,warn:true};
}
function progress(s,nm){
  const u=mins(s.until);
  let a=s.from?mins(s.from):s.prev?mins(s.prev):u-60;
  if(a>=u)a=u-60;
  return Math.round(Math.min(1,Math.max(0,(nm-a)/(u-a)))*100);
}

    const left=s.fixed?`<small>fixo</small>${s.until}`:`<small>até</small>${s.until}`;
    const status=s.done?`<button class="link muted" data-a="undo" data-v="${s.id}">Desfazer</button>`:s.skipped?'<span class="note">Passou</span>':`<button class="link" data-a="feito" data-v="${s.id}">Feito</button>`;
    return`<div class="blk${s.done?' done':''}${s.skipped?' past':''}"><div class="tm">${left}</div><div><div class="note">${esc(s.ctx)}</div><div class="ttl"><span class="t">${esc(s.head)}</span></div>${s.detail?`<div class="alts">${esc(s.detail)}</div>`:''}<div class="mini">${status}</div></div></div>`;
  }).join('')}</div>`;
}
function viewHoje(){
  const d=sel, c=custody(d), st=dayState(d), {live,nm,list}=st;
  let h='';
  if(!S.get('refOk',false))h+=refAsk();
  h+=`<div class="dateline"><span>${live?'Hoje, ':''}${WD[d.getDay()].toLowerCase()}, ${d.getDate()} de ${MES[d.getMonth()]} · ${esc(c.label)}</span><span class="arrows"><button class="icon-btn sm" data-a="day" data-v="-1" aria-label="Dia anterior">‹</button>${live?'':'<button class="icon-btn sm wide" data-a="day" data-v="0">Hoje</button>'}<button class="icon-btn sm" data-a="day" data-v="1" aria-label="Próximo dia">›</button></span></div>`;
  if(!live){
    h+=`<h1 class="plan-h">Plano de ${WD[d.getDay()].toLowerCase()}</h1>`+dayList(st);
    return h;
  }
  const rest=list.filter(s=>!s.done&&!s.skipped), cur=rest[0];
  if(cur){
    const k=clock(cur,nm), canLater=!cur.fixed&&rest[1]&&!rest[1].fixed;
    h+=`<section class="focus" aria-label="Agora">
      <div class="eyebrow">${esc(cur.ctx)}</div>
      <h1>${esc(cur.head)}</h1>
      ${cur.detail?`<p class="ctx">${esc(cur.detail)}</p>`:''}
      <div class="clock${k.warn?' warn':''}"><span class="n">${esc(k.n)}</span><span class="until">${esc(k.l)}</span><button class="q" data-a="why" aria-expanded="${whyOpen}" aria-label="Por que esse prazo?">?</button></div>
      <div class="bar"><i style="width:${progress(cur,nm)}%"></i></div>
      ${whyOpen?`<p class="why">${esc(cur.why||'')}</p>`:''}
      <div class="row"><button class="btn primary" data-a="feito" data-v="${cur.id}">Feito</button>${cur.swap?`<button class="btn soft" data-a="swap" data-v="${cur.sk}">Trocar</button>`:''}${canLater?`<button class="btn soft" data-a="later" data-v="${cur.id}">Depois</button>`:''}<button class="link" data-a="bora" data-v="${cur.id}">Começar 5 min</button></div>
    </section>`;
    const nx=rest.slice(1,3);
    if(nx.length)h+=`<section class="next"><div class="eyebrow">Depois</div>${nx.map(s=>`<div class="nx"><div><div class="h">${esc(s.head)}</div>${s.detail?`<div class="d">${esc(s.detail)}</div>`:''}</div><div class="u">${s.fixed?s.until:'até '+s.until}</div></div>`).join('')}</section>`;
  }else{
    h+=`<section class="focus"><div class="eyebrow">Dia encerrado</div><h1>Bom descanso.</h1><p class="ctx">Amanhã já está planejado.</p><div class="row"><button class="btn primary" data-a="day" data-v="1">Ver amanhã</button></div></section>`;
  }
  const fx=list.filter(s=>s.fixed&&!s.done&&!s.skipped).map(s=>s.fixed);
  if(fx.length)h+=`<p class="fixedline">Fixo hoje: ${fx.map(esc).join(' · ')}</p>`;
  h+=`<button class="link" data-a="all" aria-expanded="${showAll}">${showAll?'Esconder o dia':'Ver o dia todo'}</button>`;
  if(showAll)h+=dayList(st);
  return h;
}

function viewSemana(){
  const t=today();
  let nextMine=null;
  for(let i=0;i<21&&!nextMine;i++){const d=add(t,i);if(d.getDay()===5&&mine(d))nextMine=d}
  let h=`<div class="dayhead"><div><h1>Semana</h1><div class="date">Próximos 7 dias${nextMine?` · próximo fim de semana com Israel: sex ${ddmm(nextMine)}`:''}</div></div></div><div class="tl">`;
  for(let i=0;i<7;i++){
    const d=add(t,i), c=custody(d), wd=d.getDay(), fx=[];
    if(wd===1){if(c.am)fx.push('Levar Israel à escola, 13:30');fx.push('Buscar Israel na escola, 18:00')}
    if(wd===2){fx.push('Escola 13:30–18:00');fx.push('Célula, 19:30')}
    if(wd===3)fx.push('Levar Israel à escola, 13:30');
    if(wd===5){fx.push('Filmagem do Podcast, 10:00–16:00');if(c.pm)fx.push('Pegar Israel, 18:00')}
    if(wd===0){if(c.am)fx.push('Café na Padaria Mariléia');fx.push('Igreja, 17:00')}
    if(wd===6&&c.am)fx.push('Feira de Sábado (Âncora) de manhã');
    if([1,2,3].includes(wd)&&(wd!==1||c.am))fx.push('Montar a merenda');
    tasks.filter(x=>!x.done&&x.due===key(d)).forEach(x=>fx.push('Prazo: '+x.t));
    h+=`<button class="wk" data-a="goto" data-v="${key(d)}"><div class="d">${i===0?'Hoje':ddmm(d)}<small>${WDS[wd]}</small></div><div>${custodyChip(c)}<ul>${fx.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Dia livre de compromissos fixos</li>'}</ul></div></button>`;
  }
  h+='</div><p class="hint">Toque num dia pra ver o plano completo.</p>';
  h+=`<div class="section-title">O que eu já sei da sua rotina</div><div class="list">${HABITS.map(([a,b])=>`<div class="li nochk"><div><div class="t"><b>${esc(a)}</b></div><div class="sub">${esc(b)}</div></div><span></span></div>`).join('')}</div>`;
  h+=`<div class="soon" style="margin-top:12px"><b>Em breve: aprender sozinho.</b><br>Cruzar o histórico de localização do Google com seus pagamentos pra descobrir costumes como esses e sugerir sem você precisar contar.</div>`;
  return h;
}

function viewTarefas(){
  const open=openTasks(), done=tasks.filter(t=>t.done);
  let h=`<div class="dayhead"><div><h1>Tarefas</h1><div class="date">Trabalhos e prazos. O app encaixa nos blocos de foco.</div></div></div>`;
  h+=`<form class="form" id="taskForm" style="grid-template-columns:minmax(0,1fr) 150px auto"><input class="field" id="tt" placeholder="O que precisa ser feito?" aria-label="Tarefa" required><input class="field" id="td" type="date" aria-label="Prazo"><button class="btn primary">Adicionar</button></form>`;
  h+=`<div class="section-title">A fazer (${open.length})</div>`;
  h+=open.length?`<div class="list">${open.map(t=>`<div class="li"><button class="check" data-a="tdone" data-v="${t.id}" aria-label="Marcar como feita"></button><div><div class="t">${esc(t.t)}</div><div class="sub">${t.due?dueTag(t.due):'Sem prazo'}</div></div><button class="x" data-a="tdel" data-v="${t.id}" aria-label="Apagar">×</button></div>`).join('')}</div>`:'<p class="empty">Nada pendente. Use o campo acima ou o botão Travei pra despejar o que tá na cabeça.</p>';
  if(done.length)h+=`<div class="section-title">Feitas (${done.length})</div><div class="list">${done.map(t=>`<div class="li done"><button class="check on" data-a="tdone" data-v="${t.id}" aria-label="Desmarcar">✓</button><div class="t">${esc(t.t)}</div><button class="x" data-a="tdel" data-v="${t.id}" aria-label="Apagar">×</button></div>`).join('')}</div>`;
  return h;
}

function viewDespensa(){
  const out=pantry.filter(p=>!p.have);
  let h=`<div class="dayhead"><div><h1>Despensa</h1><div class="date">Toque no que acabou. Vai pra lista de compras.</div></div><button class="link" data-a="editPantry">${editPantry?'Pronto':'Editar'}</button></div>`;
  h+=`<div class="section-title">Lista de compras (${out.length})</div>`;
  h+=out.length?`<div class="pills">${out.map(p=>`<button class="pill buy" data-a="have" data-v="${esc(p.n)}">${esc(p.n)} <span class="rm">· comprei</span></button>`).join('')}</div>`:'<p class="empty">Nada acabou por enquanto.</p>';
  const cats=[...new Set(CATS.concat(pantry.map(p=>p.c)))];
  cats.forEach(c=>{
    const items=pantry.filter(p=>p.c===c);if(!items.length)return;
    h+=`<div class="section-title">${esc(c)}</div><div class="pills">${items.map(p=>`<button class="pill${p.have?'':' out'}" data-a="${editPantry?'pdel':'have'}" data-v="${esc(p.n)}" aria-pressed="${!p.have}">${esc(p.n)}${editPantry?' <span class="rm">×</span>':''}</button>`).join('')}</div>`;
  });
  h+=`<div class="section-title">Adicionar item</div><form class="form three" id="pantryForm"><input class="field" id="pn" placeholder="Ex.: Biscoito de polvilho" aria-label="Item" required><select class="field" id="pc" aria-label="Categoria">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="btn primary">Adicionar</button></form>`;
  return h;
}

function daysLabel(p){
  if(!p.days)return'';
  const s=p.days.slice().sort().join(',');
  if(s==='0,6')return'fim de semana';
  if(s==='1,2,3')return'seg a qua';
  return p.days.map(x=>WDS[x]).join(', ');
}
function viewLugares(){
  const row=p=>`<div class="li nochk"><div><div class="t"><b>${esc(p.n)}</b></div><div class="sub">${[p.note,daysLabel(p)].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</div></div>${editPlaces?`<button class="x" data-a="ldel" data-v="${esc(p.n)}" aria-label="Tirar">×</button>`:'<span></span>'}</div>`;
  let h=`<div class="dayhead"><div><h1>Lugares</h1><div class="date">O app sorteia daqui pros passeios e refeições.</div></div><button class="link" data-a="editPlaces">${editPlaces?'Pronto':'Editar'}</button></div>`;
  h+=`<div class="section-title">Lembretes no caminho</div><div class="list">${reminders.map(r=>`<div class="li nochk"><div><div class="t"><b>${esc(r.what)}</b></div><div class="sub">${esc(r.where||'Qualquer lugar no caminho')}</div></div><button class="x" data-a="rdel" data-v="${r.id}" aria-label="Apagar lembrete">×</button></div>`).join('')}</div>
  <form class="form three" id="remForm" style="margin-top:8px"><input class="field" id="rw" placeholder="O que (ex.: comprar carne)" aria-label="O que lembrar" required><input class="field" id="rp" placeholder="Onde (ex.: açougue)" aria-label="Onde" style="grid-column:1/-1"><button class="btn primary" style="grid-column:1/-1">Adicionar lembrete</button></form>
  <p class="hint">Quando o app estiver instalado no celular, ele avisa na hora em que você passar perto. Nesta versão fica só a lista.</p>`;
  h+=`<div class="section-title">Passeios com Israel</div><div class="list">${places.filter(p=>p.type==='passeio').map(row).join('')}</div>`;
  h+=`<div class="section-title">Pra comer</div><div class="list">${places.filter(p=>p.type==='comida').map(row).join('')}</div>`;
  h+=`<div class="section-title">Adicionar lugar</div><form class="form three" id="placeForm"><input class="field" id="ln" placeholder="Nome do lugar" aria-label="Nome" required><select class="field" id="lt" aria-label="Tipo"><option value="passeio">Passeio com Israel</option><option value="comida">Pra comer</option></select><input class="field" id="lo" placeholder="Observação (opcional)" aria-label="Observação" style="grid-column:1/-1"><button class="btn primary" style="grid-column:1/-1">Adicionar</button></form>`;
  return h;
}

function render(){
  const V={hoje:viewHoje,semana:viewSemana,tarefas:viewTarefas,despensa:viewDespensa,lugares:viewLugares};
  $('#view').innerHTML=(V[tab]||viewHoje)();
  document.querySelectorAll('.nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.v===tab));
  document.querySelectorAll('.nav button[aria-current]').forEach(b=>b.setAttribute('aria-current','page'));
}

/* ---------- Painéis: cronômetro, Travei, ajustes ---------- */
let T=null, TV=null;
function openSheet(html){$('#panel').innerHTML=html;$('#sheet').hidden=false}
function closeSheet(){$('#sheet').hidden=true;T=null;TV=null}

function startTimer(title,sub,min){
  T={title,sub,total:(min||5)*60000,end:Date.now()+(min||5)*60000,paused:null,finished:false};
  drawTimer();
}
function drawTimer(){
  if(!T)return;
  const left=T.paused!=null?T.paused:Math.max(0,T.end-Date.now());
  if(left<=0&&!T.finished){T.finished=true;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  if(T.finished){
    openSheet(`<div class="steps">Feito</div><h2>5 minutos. Começar era a parte difícil.</h2><p>${esc(T.title)}</p><div class="row"><button class="btn primary" data-a="tmore">Mais 5 minutos</button><button class="btn soft" data-a="close">Parar por aqui</button></div>`);
    return;
  }
  const s=Math.ceil(left/1000), mm=Math.floor(s/60), ss=String(s%60).padStart(2,'0');
  const pct=Math.min(100,100-left/T.total*100);
  if(!$('#tbig')){
    openSheet(`<div class="head"><div class="steps">Só 5 minutos</div><button class="x" data-a="close" aria-label="Fechar">×</button></div><h2>${esc(T.title)}</h2>${T.sub?`<p class="note">${esc(T.sub)}</p>`:''}<div class="big" id="tbig" aria-live="off"></div><div class="bar"><i id="tbar"></i></div><div class="row" style="justify-content:center"><button class="btn soft" data-a="tpause" id="tpb"></button><button class="btn primary" data-a="close">Concluí</button></div>`);
  }
  $('#tbig').textContent=mm+':'+ss;
  $('#tbar').style.width=pct+'%';
  $('#tpb').textContent=T.paused!=null?'Continuar':'Pausar';
}
setInterval(()=>{if(T&&!T.finished&&T.paused==null)drawTimer()},250);

function drawTravei(){
  if(TV.step===1){
    openSheet(`<div class="head"><div class="steps">Travei · 1 de 3</div><button class="x" data-a="close" aria-label="Fechar">×</button></div><h2>Tudo bem travar. Bota pra fora.</h2><p>Escreve tudo que tá rodando na cabeça, uma coisa por linha. Sem organizar.</p><textarea class="field" id="dump" aria-label="O que tá na cabeça" placeholder="responder o fulano&#10;mercado&#10;editar o vídeo">${esc(TV.raw||'')}</textarea><button class="btn primary block" data-a="tv2">Pronto</button>`);
    setTimeout(()=>{const el=$('#dump');if(el)el.focus()},50);
  }else if(TV.step===2){
    openSheet(`<div class="head"><div class="steps">Travei · 2 de 3</div><button class="x" data-a="close" aria-label="Fechar">×</button></div><h2>Escolhe uma. Só uma.</h2><div class="choices">${TV.items.map((x,i)=>`<button class="choice" data-a="tvpick" data-v="${i}">${esc(x)}</button>`).join('')}</div><button class="btn soft block" data-a="tvrand">Escolhe pra mim</button>`);
  }else{
    const sugg=['Só abrir o que precisa','Só separar o material','Só escrever a primeira linha','Só mandar uma mensagem','Só levantar e ir até lá'];
    openSheet(`<div class="head"><div class="steps">Travei · 3 de 3</div><button class="x" data-a="close" aria-label="Fechar">×</button></div><h2>${esc(TV.pick)}</h2><p>Qual o menor passo pra começar? Algo que dá pra fazer em 5 minutos.</p><div class="pills">${sugg.map(s=>`<button class="pill" data-a="tvstep" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div><input class="field" id="passo" aria-label="Primeiro passo" placeholder="Ou escreve o seu passo" value="${esc(TV.passo||'')}">${TV.items.length>1?`<label class="row" style="font-size:15px"><input type="checkbox" id="keep" checked> Guardar as outras ${TV.items.length-1} em Tarefas</label>`:''}<button class="btn coral block" data-a="tvgo">Começar 5 minutos</button>`);
  }
}

function drawSettings(confirmReset){
  openSheet(`<div class="head"><h2>Ajustes</h2><button class="x" data-a="close" aria-label="Fechar">×</button></div>
  <div><label class="lbl" for="refIn">Uma sexta em que o fim de semana é com Israel</label><input class="field" type="date" id="refIn" value="${ref}"><p class="hint">O app alterna de 15 em 15 dias a partir dessa data.</p></div>
  <div class="soon"><b>Em breve: aprender com o seu histórico.</b><br>Cruzar Maps, cartão, Pix e agenda pra entender seus dias anteriores e melhorar as sugestões. Tudo guardado só no aparelho.</div>
  <p class="hint">Seus dados ficam só neste aparelho e funcionam sem internet.</p>
  ${confirmReset?`<div class="ask"><p>Isso apaga tarefas, despensa e lugares que você mudou e volta pros dados iniciais.</p><div class="row"><button class="btn coral" data-a="reset2">Apagar e recomeçar</button><button class="btn soft" data-a="settings">Cancelar</button></div></div>`:`<button class="btn soft" data-a="reset1">Restaurar dados iniciais</button>`}`);
}

/* ---------- Ações ---------- */
function findStep(id){return dayState(sel).list.find(s=>s.id===id)}
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const a=e.target.closest('[data-a]');if(!a)return;
  const act=a.dataset.a, v=a.dataset.v, dk=key(sel);
  switch(act){
    case 'tab':tab=v;S.set('tab',tab);if(v==='hoje')sel=today();render();window.scrollTo(0,0);break;
    case 'day':sel=v==='0'?today():add(sel,+v);whyOpen=false;render();break;
    case 'goto':sel=parse(v);tab='hoje';S.set('tab',tab);render();window.scrollTo(0,0);break;
    case 'swap':shifts[dk]=shifts[dk]||{};shifts[dk][v]=(shifts[dk][v]||0)+1;save();render();break;
    case 'feito':{
      const s=findStep(v);if(!s)break;
      whyOpen=false;
      if(s.taskId){const t=tasks.find(x=>x.id===s.taskId);if(t)t.done=true;if(openTasks().length){save();render();break}}
      doneMap[dk]=doneMap[dk]||{};doneMap[dk][s.sk]=nowMin()+1;save();render();break}
    case 'undo':if(doneMap[dk]){delete doneMap[dk][v];delete doneMap[dk][v+'-late']}save();render();break;
    case 'later':later[dk]=(later[dk]||[]).filter(x=>x!==v).concat(v);whyOpen=false;save();render();break;
    case 'why':whyOpen=!whyOpen;render();break;
    case 'all':showAll=!showAll;render();break;
    case 'bora':{const s=findStep(v);if(s)startTimer(s.head,s.detail);break}
    case 'rdel':reminders=reminders.filter(x=>x.id!==v);save();render();break;
    case 'refyes':ref=v;S.set('refOk',true);save();render();break;
    case 'refno':ref=key(add(parse(v),7));S.set('refOk',true);save();render();break;
    case 'tdone':{const t=tasks.find(x=>x.id===v);if(t)t.done=!t.done;save();render();break}
    case 'tdel':tasks=tasks.filter(x=>x.id!==v);save();render();break;
    case 'have':{const p=pantry.find(x=>x.n===v);if(p)p.have=!p.have;save();render();break}
    case 'pdel':pantry=pantry.filter(x=>x.n!==v);save();render();break;
    case 'editPantry':editPantry=!editPantry;render();break;
    case 'ldel':places=places.filter(x=>x.n!==v);save();render();break;
    case 'editPlaces':editPlaces=!editPlaces;render();break;
    case 'travei':TV={step:1,items:[]};drawTravei();break;
    case 'tv2':{TV.raw=$('#dump').value;TV.items=TV.raw.split('\n').map(s=>s.trim()).filter(Boolean);if(!TV.items.length){$('#dump').focus();break}if(TV.items.length===1){TV.pick=TV.items[0];TV.step=3}else TV.step=2;drawTravei();break}
    case 'tvpick':TV.pick=TV.items[+v];TV.step=3;drawTravei();break;
    case 'tvrand':TV.pick=TV.items[Math.floor(Math.random()*TV.items.length)];TV.step=3;drawTravei();break;
    case 'tvstep':$('#passo').value=v;break;
    case 'tvgo':{
      const passo=$('#passo').value.trim(), keep=$('#keep');
      if(keep&&keep.checked){TV.items.filter(x=>x!==TV.pick).forEach(x=>{if(!tasks.some(t=>t.t===x&&!t.done))tasks.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,6),t:x,due:'',done:false})});save()}
      const pick=TV.pick;TV=null;startTimer(pick,passo);if(tab==='tarefas')render();break}
    case 'tpause':if(T){if(T.paused!=null){T.end=Date.now()+T.paused;T.paused=null}else T.paused=Math.max(0,T.end-Date.now());drawTimer()}break;
    case 'tmore':if(T){T.finished=false;T.total=5*60000;T.end=Date.now()+T.total;$('#panel').innerHTML='';drawTimer()}break;
    case 'close':closeSheet();render();break;
    case 'settings':drawSettings(false);break;
    case 'reset1':drawSettings(true);break;
    case 'reset2':pantry=freshPantry();places=PLACES0.slice();tasks=freshTasks();shifts={};doneMap={};save();closeSheet();render();break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='refIn'&&e.target.value){const d=parse(e.target.value);if(d.getDay()!==5){d.setDate(d.getDate()+((5-d.getDay()+7)%7))}ref=key(d);S.set('refOk',true);save();e.target.value=ref;render()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='taskForm'){const t=$('#tt').value.trim();if(!t)return;tasks.push({id:'t'+Date.now(),t,due:$('#td').value||'',done:false});save();render();$('#tt').focus()}
  if(f.id==='pantryForm'){const n=$('#pn').value.trim();if(!n||pantry.some(p=>p.n.toLowerCase()===n.toLowerCase()))return;pantry.push({n,c:$('#pc').value,have:true});save();render()}
  if(f.id==='remForm'){const w=$('#rw').value.trim();if(!w)return;reminders.push({id:'r'+Date.now(),what:w,where:$('#rp').value.trim()});save();render()}
  if(f.id==='placeForm'){const n=$('#ln').value.trim();if(!n)return;const type=$('#lt').value;places.push(P(n,type,$('#lo').value.trim(),type==='comida'?{meals:['almoco','jantar']}:{}));save();render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();render()}});
setInterval(()=>{if(tab==='hoje'&&$('#sheet').hidden&&!document.activeElement.matches('input,textarea,select'))render()},20000);

render();
})();
</script>
